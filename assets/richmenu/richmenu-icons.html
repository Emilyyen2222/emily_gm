<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Huninn&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:2500px; height:843px; background:#FFF8EF; font-family:'Huninn','PingFang TC',sans-serif;
         display:grid; grid-template-columns:repeat(3,1fr); }
  .cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:56px; position:relative; }
  .cell + .cell::before { content:''; position:absolute; left:0; top:150px; bottom:150px;
                          width:4px; background:#EAD7BD; border-radius:2px; }
  .label { font-size:100px; color:#3A2513; font-weight:700; letter-spacing:3px; }
  svg { width:180px; height:180px; }
</style></head>
<body>
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F9A726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.5 3.5a2.1 2.1 0 0 1 3 3L8 17l-4 1 1-4z"/>
      <path d="M4 21h16"/>
    </svg>
    <div class="label">今天記錄</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F9A726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
    </svg>
    <div class="label">我的紀錄</div>
  </div>
  <div class="cell">
    <svg viewBox="0 0 24 24" fill="none" stroke="#F9A726" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/>
      <path d="M9.5 9.5a2.6 2.6 0 1 1 3.2 2.5c-.5.2-.7.6-.7 1.1v.6"/>
      <path d="M12 17h.01"/>
    </svg>
    <div class="label">說明</div>
  </div>
</body></html>
